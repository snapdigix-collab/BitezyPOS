<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101010">
<title>BITEZY POS</title>
<style>
:root{--bg:#101010;--panel:#1b1b1b;--panel2:#252525;--line:#353535;--orange:#ff8a00;--white:#fff;--muted:#aaa;--red:#e64b4b;--green:#24b56b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:140px}button,input,select{font:inherit}button{border:0;border-radius:11px;padding:11px 13px;font-weight:750;cursor:pointer}.top{position:sticky;top:0;z-index:5;background:#151515;border-bottom:1px solid var(--line);padding:11px 15px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:950;letter-spacing:1.5px;color:var(--orange)}.sub{font-size:10px;color:#aaa;letter-spacing:1.5px}.connection{font-size:11px;color:#aaa}main{max-width:850px;margin:auto;padding:13px}.page{display:none}.page.active{display:block}h2{font-size:20px;margin:7px 0 13px}.muted{color:var(--muted)}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.grow{flex:1;min-width:0}input,select{width:100%;background:#202020;color:#fff;border:1px solid #444;border-radius:11px;padding:12px;outline:none}input:focus,select:focus{border-color:var(--orange)}.search{margin-bottom:11px}.chips{display:flex;gap:7px;overflow:auto;padding:2px 0 12px}.chip{white-space:nowrap;background:#292929;color:#ddd;padding:8px 12px;border-radius:22px;font-size:12px}.chip.active{background:var(--orange);color:#111}.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:115px;display:flex;flex-direction:column;justify-content:space-between}.itemname{font-weight:800}.price{color:var(--orange);font-weight:850;margin-top:4px}.primary{background:var(--orange);color:#111}.secondary{background:#333;color:#fff}.danger{background:#542525;color:#fff}.green{background:#16432c;color:#b9ffd5}.small{padding:7px 10px;font-size:12px}.full{width:100%}.cartbar{position:fixed;z-index:8;bottom:60px;left:0;right:0;background:#1a1a1a;border-top:1px solid #444;padding:10px 13px calc(10px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center}.total{font-size:19px;font-weight:900}.nav{position:fixed;bottom:0;left:0;right:0;z-index:7;background:#181818;border-top:1px solid #333;display:flex;padding:6px 5px calc(6px + env(safe-area-inset-bottom))}.nav button{flex:1;background:none;color:#aaa;font-size:12px;padding:6px}.nav button.active{color:var(--orange)}.nav span{display:block;font-size:19px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}.line{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #333}.line:last-child{border:0}.qty{display:flex;align-items:center;gap:7px;margin-left:auto}.qty button{width:31px;height:31px;padding:0;background:#333;color:#fff}.qty b{min-width:16px;text-align:center}.amount{font-weight:800;min-width:58px;text-align:right}.totalrow{display:flex;justify-content:space-between;font-size:18px;font-weight:900;padding:12px 0}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.actions button{flex:1;min-width:65px}.status{font-size:11px;padding:4px 8px;border-radius:20px;background:#333}.paid{background:#16432c;color:#b9ffd5}.unpaid{background:#563b17;color:#ffdb9a}.empty{text-align:center;padding:28px 10px;color:#999}.modalback{display:none;position:fixed;inset:0;background:#000b;z-index:20;align-items:flex-end;justify-content:center}.modalback.show{display:flex}.modal{background:#1a1a1a;border:1px solid #444;border-radius:20px 20px 0 0;padding:17px 15px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:600px;max-height:91vh;overflow:auto}.modal h3{margin:0 0 13px}.field{margin:10px 0}.field label{display:block;color:#bbb;font-size:12px;margin-bottom:5px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toast{display:none;position:fixed;top:65px;left:50%;transform:translateX(-50%);z-index:40;background:#333;padding:10px 15px;border-radius:10px;max-width:92%;text-align:center}.qrbox{background:#fff;color:#111;border-radius:12px;padding:12px;text-align:center;max-width:270px;margin:12px auto}.qrbox img{width:100%;max-width:230px}.receipt{background:#fff;color:#151515;font-family:Arial,sans-serif;width:320px;padding:17px 16px;border-radius:3px;margin:auto}.receipt .logo{text-align:center;color:#f08000;font-size:28px;font-weight:950;letter-spacing:2px}.receipt .tag{text-align:center;font-size:9px;letter-spacing:1.3px;margin:2px 0 12px}.receipt .rhead{display:flex;justify-content:space-between;font-size:10px;margin:8px 0}.receipt .rule{border-top:1px dashed #777;margin:9px 0}.receipt table{width:100%;border-collapse:collapse;font-size:11px}.receipt th{text-align:left;font-size:9px;color:#555;padding:5px 0;border-bottom:1px solid #bbb}.receipt td{padding:7px 0;border-bottom:1px dashed #ddd}.receipt td:nth-child(2),.receipt th:nth-child(2){text-align:center}.receipt td:last-child,.receipt th:last-child{text-align:right}.receipt .grand{display:flex;justify-content:space-between;font-size:17px;font-weight:900;margin:10px 0}.receipt .thanks{text-align:center;font-weight:900;font-size:14px;margin-top:12px}.receipt .footer{text-align:center;font-size:9px;color:#555;margin-top:4px}.hint{font-size:12px;color:#aaa;line-height:1.4}.storegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.storecard{overflow:hidden;background:#1b1b1b;border:1px solid #353535;border-radius:15px}.storecard img{width:100%;height:145px;object-fit:cover;background:#292929;display:block}.storebody{padding:11px}.storebody h3{font-size:15px;margin:0 0 5px}.storebody p{font-size:12px;color:#aaa;min-height:34px;margin:0 0 9px}.storehead{padding:12px;background:#171717;border:1px solid #333;border-radius:14px;margin-bottom:12px}.storehero{font-size:23px;font-weight:950;color:#ff8a00}@media(min-width:650px){.storegrid{grid-template-columns:repeat(3,minmax(0,1fr))}.storecard img{height:175px}}@media(min-width:650px){.items{grid-template-columns:repeat(3,minmax(0,1fr))}.modalback{align-items:center}.modal{border-radius:18px}.nav{max-width:850px;left:50%;transform:translateX(-50%);border-radius:14px 14px 0 0}}
</style>
</head>
<body>
<header class="top"><div><div class="brand">BITEZY</div><div class="sub">QUICK ORDER POS</div></div><div class="connection" id="connection">Connecting…</div></header>
<main>
<section id="page-pos" class="page active">
 <div class="row between"><h2>New Order</h2><button class="secondary small" onclick="loadItems()">↻ Refresh</button></div>
 <input id="itemSearch" class="search" placeholder="Search menu items…" oninput="renderItems()">
 <div id="categories" class="chips"></div><div id="items" class="items"><div class="empty">Loading menu…</div></div>
</section>
<section id="page-orders" class="page">
 <div class="row between"><h2>View Orders</h2><button class="secondary small" onclick="loadOrders()">↻ Refresh</button></div>
 <input id="orderSearch" class="search" placeholder="Search order ID…" oninput="renderOrders()">
 <div class="two"><select id="statusFilter" onchange="renderOrders()"><option value="all">All order statuses</option><option>Pending</option><option>Completed</option><option>Cancelled</option></select><select id="payFilter" onchange="renderOrders()"><option value="all">All payments</option><option>Paid</option><option>Unpaid</option></select></div>
 <div id="ordersList" style="margin-top:11px"></div>
</section>
<section id="page-admin" class="page">
 <div class="row between"><h2>Menu Admin</h2><button class="primary small" onclick="editItem()">＋ Add Item</button></div>
 <p class="hint">Add and manage menu items here. Inactive items are hidden from the POS counter.</p><div id="adminItems"></div>
 <div class="card"><h3>Business Settings</h3><div class="field"><label>UPI ID (for payment QR)</label><input id="upiId" placeholder="yourupi@bank"></div><div class="field"><label>Business name on ticket</label><input id="businessName" value="BITEZY"></div><button class="primary full" onclick="saveSettings()">Save Settings</button></div>
</section>
<section id="page-store" class="page">
 <div class="storehead"><div class="storehero">BITEZY</div><div class="hint">Fresh, crispy and made for you.</div></div>
 <input id="storeSearch" class="search" placeholder="Search menu…" oninput="renderStore()">
 <div id="storeCategories" class="chips"></div>
 <div id="storeProducts" class="storegrid"><div class="empty">Loading menu…</div></div>
</section>
</main>
<div id="cartbar" class="cartbar"><div class="grow"><div class="muted" id="cartCount">0 items</div><div class="total" id="cartTotal">₹0</div></div><button class="primary" onclick="openCart()">View Cart →</button></div>
<nav class="nav"><button class="active" data-page="pos" onclick="showPage('pos')"><span>＋</span>POS</button><button data-page="orders" onclick="showPage('orders')"><span>▤</span>Orders</button><button data-page="admin" onclick="showPage('admin')"><span>⚙</span>Admin</button><button data-page="store" onclick="openStorefront()"><span>🌐</span>Website</button></nav>
<div id="modalback" class="modalback" onclick="backdropClose(event)"><div class="modal" id="modal"></div></div><div id="toast" class="toast"></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbwycIXsp7K7KI6xkM6xlByFEVv3_XXlAdLpjBVGARpl-kofKhlOzUNHQgyYSqzW9FQOUQ/exec";
let items=[],orders=[],cart={},storeCart={},activeCategory="All",storeCategory="All",settings={upiId:"",businessName:"BITEZY"},editing=null; const STORE_MODE=new URLSearchParams(location.search).get("store")==="1";
const money=n=>"₹"+Number(n||0).toFixed(2).replace(/\.00$/,"");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(s){const t=document.getElementById("toast");t.textContent=s;t.style.display="block";setTimeout(()=>t.style.display="none",2800)}
function api(action,data={}){return new Promise((resolve,reject)=>{if(!API_URL.startsWith("https://script.google.com/"))return reject(Error("First paste the Apps Script Web App URL into index.html."));const cb="bitezy_cb_"+Date.now()+"_"+Math.floor(Math.random()*9999),sc=document.createElement("script"),timer=setTimeout(()=>{clean();reject(Error("Server timeout. Check Apps Script deployment."))},20000);function clean(){clearTimeout(timer);delete window[cb];sc.remove()}window[cb]=r=>{clean();r?.success?resolve(r):reject(Error(r?.message||"Request failed"))};sc.onerror=()=>{clean();reject(Error("Unable to connect to Google Sheets."))};sc.src=API_URL+"?"+new URLSearchParams({action,callback:cb,payload:JSON.stringify(data)});document.body.appendChild(sc)})}
async function init(){if(STORE_MODE){document.body.classList.add("store-only");document.querySelector(".top .sub").textContent="ORDER ONLINE";document.querySelector(".connection").style.display="none";document.querySelector(".nav").style.display="none";document.getElementById("cartbar").style.display="none";document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById("page-store").classList.add("active");}try{const r=await api("init");items=r.items||[];settings=r.settings||settings;document.getElementById("connection").textContent="● Connected";document.getElementById("connection").style.color="#24b56b";document.getElementById("upiId").value=settings.upiId||"";document.getElementById("businessName").value=settings.businessName||"BITEZY";renderItems();renderAdmin();if(STORE_MODE){renderStore();renderStoreCartBar()}}catch(e){document.getElementById("connection").textContent="● Offline";toast(e.message)}}
async function loadItems(){try{const r=await api("getItems");items=r.items||[];renderItems();renderAdmin()}catch(e){toast(e.message)}}
function showPage(p){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById("page-"+p).classList.add("active");document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));document.getElementById("cartbar").style.display=p==="pos"?"flex":"none";if(p==="orders")loadOrders();if(p==="admin")renderAdmin()}
function renderItems(){const q=document.getElementById("itemSearch").value.toLowerCase(),list=items.filter(i=>i.active!==false&&i.showPOS!==false&&i.name.toLowerCase().includes(q)),cats=["All",...new Set(list.map(i=>i.category||"Other"))];if(!cats.includes(activeCategory))activeCategory="All";document.getElementById("categories").innerHTML=cats.map(c=>`<button class="chip ${c===activeCategory?"active":""}" onclick="activeCategory='${esc(c)}';renderItems()">${esc(c)}</button>`).join("");const shown=list.filter(i=>activeCategory==="All"||(i.category||"Other")===activeCategory);document.getElementById("items").innerHTML=shown.length?shown.map(i=>`<div class="item"><div><div class="itemname">${esc(i.name)}</div><div class="price">${money(i.price)}</div></div><div class="row between"><small class="muted">${esc(i.category||"Other")}</small><button class="primary small" onclick="addCart('${esc(i.id)}')">＋ Add</button></div></div>`).join(""):'<div class="empty">No active items. Add menu items in Admin.</div>'}
function addCart(id){const i=items.find(x=>x.id===id);if(!i)return;if(!cart[id])cart[id]={id,name:i.name,price:Number(i.price),qty:0};cart[id].qty++;updateCart()}
function qty(id,d){if(!cart[id])return;cart[id].qty+=d;if(cart[id].qty<=0)delete cart[id];updateCart()}
function totalCart(){return Object.values(cart).reduce((s,i)=>s+i.price*i.qty,0)}
function updateCart(){const n=Object.values(cart).reduce((s,i)=>s+i.qty,0);document.getElementById("cartCount").textContent=n+" items";document.getElementById("cartTotal").textContent=money(totalCart())}
function openCart(){const a=Object.values(cart);if(!a.length)return toast("Select items first.");modal(`<h3>Confirm Order</h3>${a.map(i=>`<div class="line"><div class="grow"><b>${esc(i.name)}</b><div class="muted">${money(i.price)} each</div></div><div class="qty"><button onclick="qty('${esc(i.id)}',-1);openCart()">−</button><b>${i.qty}</b><button onclick="qty('${esc(i.id)}',1);openCart()">＋</button></div><div class="amount">${money(i.price*i.qty)}</div></div>`).join("")}<div class="totalrow"><span>Total</span><span>${money(totalCart())}</span></div><button class="primary full" onclick="confirmOrder()">Confirm & Save Order</button><button class="secondary full" style="margin-top:8px" onclick="closeModal()">Back to POS</button>`)}
async function confirmOrder(){try{const r=await api("createOrder",{items:Object.values(cart),total:totalCart(),source:"POS"});cart={};updateCart();closeModal();toast("Saved: "+r.orderId);showPage("orders")}catch(e){toast(e.message)}}
async function loadOrders(){try{const r=await api("getOrders");orders=r.orders||[];renderOrders()}catch(e){toast(e.message)}}
function renderOrders(){const q=document.getElementById("orderSearch").value.toLowerCase(),sf=document.getElementById("statusFilter").value,pf=document.getElementById("payFilter").value,a=orders.filter(o=>(o.orderId.toLowerCase().includes(q))&&(sf==="all"||o.status===sf)&&(pf==="all"||o.paymentStatus===pf));document.getElementById("ordersList").innerHTML=a.length?a.map(o=>`<div class="card"><div class="row between"><b>${esc(o.orderId)}</b><span class="status ${o.paymentStatus==="Paid"?"paid":"unpaid"}">${esc(o.paymentStatus)}</span></div><div class="muted" style="font-size:11px;margin:5px 0">${esc(o.date)} · ${esc(o.status)} · ${esc(o.source||"POS")}${o.fulfilment?" · "+esc(o.fulfilment):""}${o.customerName?" · "+esc(o.customerName):""}</div><div class="hint">${o.items.map(i=>`${esc(i.name)} × ${i.qty}`).join(" · ")}</div><div class="totalrow"><span>Total</span><span>${money(o.total)}</span></div><div class="actions"><button class="secondary small" onclick="viewOrder('${esc(o.orderId)}')">View</button><button class="secondary small" onclick="editOrder('${esc(o.orderId)}')">Edit</button><button class="danger small" onclick="deleteOrder('${esc(o.orderId)}')">Delete</button></div></div>`).join(""):'<div class="empty">No orders yet.</div>'}
function findOrder(id){return orders.find(o=>o.orderId===id)}
function viewOrder(id){const o=findOrder(id);if(!o)return;modal(`<h3>Order ${esc(id)}</h3><div class="muted">${esc(o.date)} · ${esc(o.source||"POS")}${o.fulfilment?" · "+esc(o.fulfilment):""}</div>${o.customerName?`<div class="hint" style="margin:8px 0">Customer: ${esc(o.customerName)} · ${esc(o.customerPhone||"")}</div>`:""}${o.items.map(i=>`<div class="line"><div class="grow">${esc(i.name)} × ${i.qty}</div><div class="amount">${money(i.price*i.qty)}</div></div>`).join("")}<div class="totalrow"><span>Total</span><span>${money(o.total)}</span></div><div class="two"><div class="field"><label>Order Status</label><select id="detailStatus"><option ${o.status==="Pending"?"selected":""}>Pending</option><option ${o.status==="Preparing"?"selected":""}>Preparing</option><option ${o.status==="Ready"?"selected":""}>Ready</option><option ${o.status==="Completed"?"selected":""}>Completed</option><option ${o.status==="Cancelled"?"selected":""}>Cancelled</option></select></div><div class="field"><label>Payment Status</label><select id="detailPay"><option ${o.paymentStatus==="Unpaid"?"selected":""}>Unpaid</option><option ${o.paymentStatus==="Paid"?"selected":""}>Paid</option></select></div></div><button class="primary full" onclick="saveStatus('${esc(id)}')">Save Status</button><button class="secondary full" style="margin-top:8px" onclick="paymentQR('${esc(id)}')">▦ Generate UPI QR</button><button class="primary full" style="margin-top:8px" onclick="shareTicket('${esc(id)}')">Share Bill Ticket on WhatsApp</button><button class="secondary full" style="margin-top:8px" onclick="printTicket('${esc(id)}')">Print Ticket</button>`)}
async function saveStatus(id){try{await api("updateOrder",{orderId:id,status:document.getElementById("detailStatus").value,paymentStatus:document.getElementById("detailPay").value});await loadOrders();viewOrder(id);toast("Order updated")}catch(e){toast(e.message)}}
async function deleteOrder(id){if(!confirm("Delete "+id+" permanently?"))return;try{await api("deleteOrder",{orderId:id});await loadOrders();toast("Order deleted")}catch(e){toast(e.message)}}
function editOrder(id){const o=findOrder(id);editing=JSON.parse(JSON.stringify(o));modal(`<h3>Edit ${esc(id)}</h3><div id="editRows"></div><div class="totalrow"><span>Total</span><span id="editTotal">${money(editing.total)}</span></div><button class="primary full" onclick="saveEdit()">Save Changes</button>`);renderEditRows()}
function renderEditRows(){document.getElementById("editRows").innerHTML=editing.items.map((i,n)=>`<div class="line"><div class="grow">${esc(i.name)}<div class="muted">${money(i.price)}</div></div><div class="qty"><button onclick="editQty(${n},-1)">−</button><b>${i.qty}</b><button onclick="editQty(${n},1)">＋</button></div><div class="amount">${money(i.price*i.qty)}</div></div>`).join("")}
function editQty(n,d){editing.items[n].qty+=d;if(editing.items[n].qty<=0)editing.items.splice(n,1);editing.total=editing.items.reduce((s,i)=>s+i.price*i.qty,0);document.getElementById("editTotal").textContent=money(editing.total);renderEditRows()}
async function saveEdit(){if(!editing.items.length)return toast("An order cannot be empty.");try{await api("updateOrder",{orderId:editing.orderId,items:editing.items,total:editing.total});await loadOrders();closeModal();toast("Order updated")}catch(e){toast(e.message)}}
function paymentQR(id){const o=findOrder(id);if(!settings.upiId)return toast("Add UPI ID in Admin settings first.");const upi=`upi://pay?pa=${encodeURIComponent(settings.upiId)}&pn=${encodeURIComponent(settings.businessName||"BITEZY")}&am=${Number(o.total).toFixed(2)}&cu=INR&tn=${encodeURIComponent("BITEZY "+id)}`,src="https://quickchart.io/qr?size=280&text="+encodeURIComponent(upi);modal(`<h3>Payment QR · ${esc(id)}</h3><div class="qrbox"><img src="${src}" alt="UPI QR"><b>${money(o.total)}</b><div style="font-size:11px">Scan with any UPI app</div></div><p class="hint" style="text-align:center">QR generation is not payment confirmation. Verify payment in your UPI app before marking Paid.</p><button class="secondary full" onclick="closeModal()">Close</button>`)}
function ticketMarkup(o){return `<div class="receipt" id="ticketCapture"><div class="logo">${esc(settings.businessName||"BITEZY")}</div><div class="tag">GOOD FOOD. GOOD MOOD.</div><div class="rhead"><span>BILL NO: ${esc(o.orderId)}</span><span>${esc(o.date)}</span></div><div class="rule"></div><table><thead><tr><th>ITEM</th><th>QTY</th><th>AMOUNT</th></tr></thead><tbody>${o.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.price*i.qty)}</td></tr>`).join("")}</tbody></table><div class="rule"></div><div class="grand"><span>TOTAL</span><span>${money(o.total)}</span></div><div class="rhead"><span>PAYMENT</span><b>${esc(o.paymentStatus||"Unpaid").toUpperCase()}</b></div><div class="thanks">THANK YOU!</div><div class="footer">GOOD FOOD. GOOD MOOD. ❤️</div></div>`}
async function makeTicketBlob(o){const wrap=document.createElement("div");wrap.style.cssText="position:fixed;left:-10000px;top:0;z-index:-1";wrap.innerHTML=ticketMarkup(o);document.body.appendChild(wrap);const el=wrap.firstElementChild;try{await document.fonts.ready;const scale=2,canvas=document.createElement("canvas"),w=640,h=Math.max(500,el.scrollHeight*2);canvas.width=w;canvas.height=h;const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);const rows=o.items.length,top=30;ctx.fillStyle="#f08000";ctx.textAlign="center";ctx.font="900 52px Arial";ctx.fillText(settings.businessName||"BITEZY",w/2,top+50);ctx.fillStyle="#333";ctx.font="18px Arial";ctx.fillText("GOOD FOOD. GOOD MOOD.",w/2,top+82);ctx.textAlign="left";ctx.fillStyle="#222";ctx.font="18px Arial";ctx.fillText("BILL NO: "+o.orderId,32,top+130);ctx.textAlign="right";ctx.fillText(o.date,w-32,top+130);let y=top+160;ctx.setLineDash([7,5]);ctx.beginPath();ctx.moveTo(30,y);ctx.lineTo(w-30,y);ctx.strokeStyle="#888";ctx.stroke();y+=35;ctx.setLineDash([]);ctx.font="bold 17px Arial";ctx.fillStyle="#555";ctx.textAlign="left";ctx.fillText("ITEM",32,y);ctx.textAlign="center";ctx.fillText("QTY",w-185,y);ctx.textAlign="right";ctx.fillText("AMOUNT",w-32,y);y+=18;ctx.strokeStyle="#bbb";ctx.beginPath();ctx.moveTo(30,y);ctx.lineTo(w-30,y);ctx.stroke();y+=35;ctx.font="20px Arial";ctx.fillStyle="#111";for(const i of o.items){ctx.textAlign="left";ctx.fillText(i.name,32,y);ctx.textAlign="center";ctx.fillText(String(i.qty),w-185,y);ctx.textAlign="right";ctx.fillText(money(i.price*i.qty),w-32,y);y+=38;ctx.strokeStyle="#ddd";ctx.beginPath();ctx.moveTo(30,y-12);ctx.lineTo(w-30,y-12);ctx.stroke()}y+=18;ctx.setLineDash([7,5]);ctx.beginPath();ctx.moveTo(30,y);ctx.lineTo(w-30,y);ctx.strokeStyle="#888";ctx.stroke();ctx.setLineDash([]);y+=48;ctx.font="bold 30px Arial";ctx.textAlign="left";ctx.fillText("TOTAL",32,y);ctx.textAlign="right";ctx.fillStyle="#f08000";ctx.fillText(money(o.total),w-32,y);y+=45;ctx.fillStyle="#333";ctx.font="18px Arial";ctx.textAlign="left";ctx.fillText("PAYMENT: "+String(o.paymentStatus||"Unpaid").toUpperCase(),32,y);y+=58;ctx.textAlign="center";ctx.font="bold 28px Arial";ctx.fillStyle="#111";ctx.fillText("THANK YOU!",w/2,y);y+=30;ctx.font="17px Arial";ctx.fillStyle="#666";ctx.fillText("GOOD FOOD. GOOD MOOD. ❤️",w/2,y);const finalCanvas=document.createElement("canvas");finalCanvas.width=w;finalCanvas.height=y+35;finalCanvas.getContext("2d").drawImage(canvas,0,0);return await new Promise(resolve=>finalCanvas.toBlob(resolve,"image/png"))}finally{wrap.remove()}}
async function shareTicket(id){const o=findOrder(id);if(!o)return;const phone=prompt("Customer's 10-digit WhatsApp number:");if(phone===null)return;const digits=phone.replace(/\D/g,"");if(!/^[6-9]\d{9}$/.test(digits))return toast("Enter a valid 10-digit Indian mobile number.");try{const blob=await makeTicketBlob(o);const file=new File([blob],`BITEZY-${o.orderId}.png`,{type:"image/png"});const shareData={files:[file],title:"BITEZY Bill "+o.orderId,text:`BITEZY bill for ${digits}. Order ${o.orderId} · ${money(o.total)}`};if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){await navigator.share(shareData);toast("Choose WhatsApp, then select customer "+digits+" and send the ticket.")}else{const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);toast("Ticket image saved. Open WhatsApp and attach it to "+digits+". This browser cannot open the image share sheet.")}}catch(e){if(e.name!=="AbortError")toast("Could not share ticket: "+e.message)}}
function printTicket(id){const o=findOrder(id);const w=window.open("","_blank","width=400,height=650");if(!w)return toast("Allow pop-ups to print.");w.document.write(`<html><head><title>${esc(id)}</title><style>body{font-family:Arial;padding:10px}.receipt{width:300px;margin:auto}.logo{text-align:center;color:#f08000;font-size:28px;font-weight:900}.tag,.thanks,.footer{text-align:center}.rhead{display:flex;justify-content:space-between;font-size:10px;margin:8px 0}.rule{border-top:1px dashed #777;margin:9px 0}table{width:100%;font-size:11px;border-collapse:collapse}td,th{padding:6px 0;border-bottom:1px dashed #ddd}td:last-child,th:last-child{text-align:right}td:nth-child(2),th:nth-child(2){text-align:center}.grand{display:flex;justify-content:space-between;font-size:18px;font-weight:bold}.thanks{font-weight:bold;margin-top:15px}</style></head><body>${ticketMarkup(o)}<script>window.onload=()=>window.print()<\\/script></body></html>`);w.document.close()}
function editItem(id){const x=id?items.find(i=>i.id===id):{name:"",price:"",category:"Fries",active:true,description:"",imageUrl:"",showPOS:true,showWebsite:true,onlineEnabled:true};modal(`<h3>${id?"Edit Product":"Add Product"}</h3><div class="field"><label>Product Name</label><input id="fName" value="${esc(x.name)}"></div><div class="two"><div class="field"><label>Price ₹</label><input id="fPrice" type="number" min="0" step=".01" value="${esc(x.price)}"></div><div class="field"><label>Category</label><input id="fCat" value="${esc(x.category||"Other")}"></div></div><div class="field"><label>Product Photo URL</label><input id="fImage" type="url" value="${esc(x.imageUrl||"")}" placeholder="Paste direct image URL here" oninput="previewProductUrl(this.value)"><div class="hint">Paste a direct image link from Blogger (or another image host). Example: https://blogger.googleusercontent.com/...</div><img id="photoPreview" src="${esc(x.imageUrl||"")}" alt="Product preview" style="${x.imageUrl?'':'display:none;'};width:110px;height:85px;object-fit:cover;border-radius:10px;margin-top:8px" onerror="this.style.display='none'"></div><div class="field"><label>Description (website)</label><input id="fDescription" value="${esc(x.description||"")}" placeholder="Short product description"></div><div class="two"><div class="field"><label>POS Visibility</label><select id="fPOS"><option value="true" ${x.showPOS!==false?"selected":""}>Show in POS</option><option value="false" ${x.showPOS===false?"selected":""}>Hide from POS</option></select></div><div class="field"><label>Website Visibility</label><select id="fWeb"><option value="true" ${x.showWebsite!==false?"selected":""}>Show on Website</option><option value="false" ${x.showWebsite===false?"selected":""}>Hide from Website</option></select></div></div><div class="field"><label>Product Status</label><select id="fActive"><option value="true" ${x.active!==false?"selected":""}>Active</option><option value="false" ${x.active===false?"selected":""}>Inactive</option></select></div><button class="primary full" onclick="saveItem('${id||""}')">Save Product</button>`)}
function previewProductUrl(value){const preview=document.getElementById("photoPreview");if(!preview)return;const url=String(value||"").trim();if(!url){preview.removeAttribute("src");preview.style.display="none";return;}preview.src=url;preview.style.display="block";preview.onerror=()=>{preview.style.display="none"}}
async function saveItem(id){const name=document.getElementById("fName").value.trim(),price=Number(document.getElementById("fPrice").value),category=document.getElementById("fCat").value.trim()||"Other",active=document.getElementById("fActive").value==="true",imageUrl=document.getElementById("fImage").value.trim(),description=document.getElementById("fDescription").value.trim(),showPOS=document.getElementById("fPOS").value==="true",showWebsite=document.getElementById("fWeb").value==="true";if(!name||!Number.isFinite(price)||price<0)return toast("Enter a valid product name and price.");try{await api("saveItem",{id,name,price,category,active,imageUrl,description,showPOS,showWebsite,onlineEnabled:showWebsite});await loadItems();closeModal();toast("Product saved for POS and Website")}catch(e){toast(e.message)}}
async function deleteItem(id){if(!confirm("Delete this item?"))return;try{await api("deleteItem",{id});await loadItems();toast("Item deleted")}catch(e){toast(e.message)}}
function renderAdmin(){document.getElementById("adminItems").innerHTML=items.length?items.map(i=>`<div class="card row"><div class="grow"><b>${esc(i.name)}</b><div class="muted" style="font-size:12px">${esc(i.category||"Other")} · ${money(i.price)} · ${i.active===false?"Inactive":"Active"}</div></div><button class="secondary small" onclick="editItem('${esc(i.id)}')">Edit</button><button class="danger small" onclick="deleteItem('${esc(i.id)}')">×</button></div>`).join(""):'<div class="empty">No items. Add your first item.</div>'}
async function saveSettings(){settings={upiId:document.getElementById("upiId").value.trim(),businessName:document.getElementById("businessName").value.trim()||"BITEZY"};try{await api("saveSettings",settings);toast("Settings saved")}catch(e){toast(e.message)}}
function openStorefront(){window.open(location.pathname+"?store=1","_blank")}
function renderStore(){const q=(document.getElementById("storeSearch").value||"").toLowerCase(),list=items.filter(i=>i.active!==false&&i.showWebsite!==false&&i.onlineEnabled!==false&&i.name.toLowerCase().includes(q)),cats=["All",...new Set(list.map(i=>i.category||"Other"))];if(!cats.includes(storeCategory))storeCategory="All";document.getElementById("storeCategories").innerHTML=cats.map(c=>`<button class="chip ${c===storeCategory?"active":""}" onclick="storeCategory='${esc(c)}';renderStore()">${esc(c)}</button>`).join("");const shown=list.filter(i=>storeCategory==="All"||(i.category||"Other")===storeCategory);document.getElementById("storeProducts").innerHTML=shown.length?shown.map(i=>`<article class="storecard">${i.imageUrl?`<img src="${esc(i.imageUrl)}" alt="${esc(i.name)}" loading="lazy" onerror="this.style.display='none'">`:`<div style="height:145px;background:#292929;display:grid;place-items:center;color:#777">BITEZY</div>`}<div class="storebody"><h3>${esc(i.name)}</h3><p>${esc(i.description||"Freshly prepared. Order now.")}</p><div class="row between"><b class="price">${money(i.price)}</b><button class="primary small" onclick="addStoreCart('${esc(i.id)}')">＋ Add</button></div></div></article>`).join(""):'<div class="empty">No products available right now.</div>'}
function addStoreCart(id){const i=items.find(x=>x.id===id);if(!i)return;if(!storeCart[id])storeCart[id]={id,name:i.name,price:Number(i.price),qty:0};storeCart[id].qty++;renderStoreCartBar()}
function storeTotal(){return Object.values(storeCart).reduce((s,i)=>s+i.price*i.qty,0)}
function renderStoreCartBar(){const count=Object.values(storeCart).reduce((s,i)=>s+i.qty,0),bar=document.getElementById("cartbar");bar.style.display=count?"flex":"none";bar.innerHTML=`<div class="grow"><div class="muted">${count} items in cart</div><div class="total">${money(storeTotal())}</div></div><button class="primary" onclick="openStoreCart()">Review Cart →</button>`}
function openStoreCart(){const a=Object.values(storeCart);if(!a.length)return;modal(`<h3>Your Cart</h3>${a.map(i=>`<div class="line"><div class="grow"><b>${esc(i.name)}</b><div class="muted">${money(i.price)}</div></div><div class="qty"><button onclick="changeStoreQty('${esc(i.id)}',-1);openStoreCart()">−</button><b>${i.qty}</b><button onclick="changeStoreQty('${esc(i.id)}',1);openStoreCart()">＋</button></div><div class="amount">${money(i.qty*i.price)}</div></div>`).join("")}<div class="totalrow"><span>Total</span><span>${money(storeTotal())}</span></div><h3 style="margin-top:12px">Pickup Details</h3><div class="card" style="padding:10px;margin:8px 0"><b>🏪 Store Pickup</b><div class="hint">Collect your order from BITEZY. No delivery address required.</div></div><div class="field"><label>Your Name</label><input id="webCustomerName" placeholder="Enter your name"></div><div class="field"><label>10-digit Mobile Number</label><input id="webCustomerPhone" type="tel" inputmode="numeric" maxlength="10" placeholder="Mobile number"></div><button class="primary full" onclick="placeOnlineOrder()">Place Order</button>`)}
function changeStoreQty(id,d){if(!storeCart[id])return;storeCart[id].qty+=d;if(storeCart[id].qty<=0)delete storeCart[id];renderStoreCartBar()}
async function placeOnlineOrder(){const customerName=document.getElementById("webCustomerName").value.trim(),customerPhone=document.getElementById("webCustomerPhone").value.replace(/\D/g,"");if(!customerName)return toast("Enter your name.");if(!/^[6-9]\d{9}$/.test(customerPhone))return toast("Enter a valid 10-digit mobile number.");try{const r=await api("createOrder",{items:Object.values(storeCart),total:storeTotal(),source:"Website",fulfilment:"Pickup",customerName,customerPhone});storeCart={};renderStoreCartBar();modal(`<div style="text-align:center;padding:15px 0"><div style="font-size:42px">✓</div><h3>Order Placed!</h3><p>Your order number is</p><div class="storehero">${esc(r.orderId)}</div><p class="hint">Thank you, ${esc(customerName)}. Your pickup order has been received. Please collect it from BITEZY after confirmation.</p><button class="primary full" onclick="closeModal()">Continue Shopping</button></div>`)}catch(e){toast(e.message)}}
function modal(html){document.getElementById("modal").innerHTML=html;document.getElementById("modalback").classList.add("show")}
function closeModal(){document.getElementById("modalback").classList.remove("show");document.getElementById("modal").innerHTML=""}
function backdropClose(e){if(e.target.id==="modalback")closeModal()}
init();
</script>
</body></html>
